version: '3.8'

# Acceptance stack — deployed per pull request.
# Deploy:   docker stack deploy -c docker-stack.acc.yml notifyme-acc-pr<NUMBER>
# Teardown: docker stack rm notifyme-acc-pr<NUMBER>
#
# Docker Swarm automatically prefixes volumes with the stack name, so each
# PR gets isolated data volumes (e.g. notifyme-acc-pr42_mongo-task-data).
# IMAGE_TAG must be set to the PR image tag, e.g. pr-42.

networks:
  notifyme-acc:
    driver: overlay

volumes:
  mongo-task-data:
  mongo-user-data:
  rabbitmq-data:

services:

  # ── Application services ──────────────────────────────────────────────────

  api-gateway:
    image: notifyme-api-gateway:${IMAGE_TAG}
    ports:
      - "4000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      TASK_SERVICE_URL: "http://task-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  task-service:
    image: notifyme-task-service:${IMAGE_TAG}
    environment:
      PORT: "3001"
      MONGO_URI: "mongodb://mongo-task:27017/taskdb"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      RABBITMQ_URL: "amqp://user:${RABBITMQ_PASS}@rabbitmq:5672"
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  user-service:
    image: notifyme-user-service:${IMAGE_TAG}
    environment:
      PORT: "3002"
      MONGO_URI: "mongodb://mongo-user:27017/userdb"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      RABBITMQ_URL: "amqp://user:${RABBITMQ_PASS}@rabbitmq:5672"
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mail-service:
    image: notifyme-mail-service:${IMAGE_TAG}
    environment:
      PORT: "3003"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      RABBITMQ_URL: "amqp://user:${RABBITMQ_PASS}@rabbitmq:5672"
      RESEND_API_KEY: "${RESEND_API_KEY}"
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Data services (volumes keep data outside containers) ──────────────────

  mongo-task:
    image: mongo:8
    volumes:
      - mongo-task-data:/data/db
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  mongo-user:
    image: mongo:8
    volumes:
      - mongo-user-data:/data/db
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - notifyme-acc
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
